<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M094 — понятная шпаргалка</title>
<style>
:root{
  --bg:#f6f8fb;
  --paper:#ffffff;
  --paper2:#f9fafb;
  --text:#172033;
  --muted:#667085;
  --line:#e6eaf0;
  --brand:#2563eb;
  --brand2:#0ea5e9;
  --green:#16a34a;
  --soft-blue:#eff6ff;
  --soft-green:#ecfdf3;
  --soft-yellow:#fffbeb;
  --shadow:0 14px 34px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:linear-gradient(180deg,#f8fbff 0%,#f6f8fb 38%,#eef3f8 100%);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  line-height:1.62;
  font-size:16px;
}
header{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.wrap{max-width:1180px;margin:auto;padding:16px 18px}
.top{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
h1{margin:0;font-size:24px;letter-spacing:-.03em;color:#0f172a}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.actions{display:flex;gap:10px;align-items:center}
.search{
  min-width:360px;padding:13px 15px;border-radius:16px;
  border:1px solid #d8dee8;background:#fff;color:var(--text);outline:none;
  box-shadow:0 1px 0 rgba(16,24,40,.02);
}
.search:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(37,99,235,.10)}
button{
  border:1px solid #d8dee8;border-radius:16px;padding:11px 14px;
  background:#fff;color:#1f2937;cursor:pointer;font-weight:700;
  transition:.18s ease;
}
button:hover{border-color:#93c5fd;background:#f8fbff;transform:translateY(-1px)}
.subjects{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;
  background:#eef2f7;border:1px solid var(--line);border-radius:20px;padding:6px;
}
.subject{font-weight:850;font-size:15px;padding:13px;border-radius:15px;background:transparent;border:0;color:#475467}
.subject.active{background:#fff;color:var(--brand);box-shadow:0 8px 20px rgba(16,24,40,.08)}
.topicbar{display:flex;gap:8px;overflow:auto;padding:13px 2px 4px;scrollbar-width:thin}
.topic{white-space:nowrap;border-radius:999px;padding:9px 13px;font-size:13px;background:#fff;color:#344054}
.topic.active{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8}
main{max-width:1180px;margin:auto;padding:20px 18px 56px}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-bottom:20px}
.panel{
  background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:28px;padding:22px;
  box-shadow:var(--shadow);
}
.hero h2{margin:0 0 8px;font-size:31px;line-height:1.17;letter-spacing:-.04em;color:#0f172a}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.chip{padding:8px 11px;border-radius:999px;background:var(--soft-blue);border:1px solid #bfdbfe;font-size:12px;color:#1d4ed8;font-weight:750}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:linear-gradient(180deg,#fff,#f8fafc);border:1px solid var(--line);border-radius:22px;padding:17px}
.stat b{display:block;font-size:30px;color:var(--brand);line-height:1}
.stat span{color:var(--muted);font-size:13px;font-weight:650}
.section-title{display:flex;align-items:center;gap:10px;margin:28px 0 13px}
.section-title h2{margin:0;font-size:25px;letter-spacing:-.03em;color:#111827}
.count{font-size:12px;color:#475467;background:#fff;border:1px solid var(--line);padding:5px 9px;border-radius:999px;font-weight:750}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{
  background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;min-height:170px;
  box-shadow:0 8px 24px rgba(16,24,40,.055);
}
.card:hover{border-color:#bfdbfe;box-shadow:0 18px 34px rgba(37,99,235,.11)}
.card h3{margin:0 0 9px;font-size:19px;color:#0f172a;letter-spacing:-.02em}
.card p{margin:9px 0;color:#344054}
.label{font-size:11px;color:#667085;text-transform:uppercase;letter-spacing:.08em;margin-top:14px;font-weight:850}
.code{
  background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:12px 13px;overflow:auto;
  color:#0f172a;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap;
}
.note{border-left:4px solid #f59e0b;padding:9px 0 9px 12px;color:#854d0e;background:var(--soft-yellow);border-radius:0 12px 12px 0}
.empty{text-align:center;color:var(--muted);padding:46px;background:#fff;border:1px solid var(--line);border-radius:24px}
.float{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;z-index:60}
.float button{background:#fff;box-shadow:0 10px 28px rgba(16,24,40,.12)}
@media(max-width:820px){
  .top{display:block}.actions{margin-top:12px;display:grid;grid-template-columns:1fr auto}.search{min-width:0;width:100%}
  .subjects{grid-template-columns:1fr 1fr}main,.wrap{padding-left:13px;padding-right:13px}.hero{grid-template-columns:1fr}.hero h2{font-size:25px}
  .panel{border-radius:22px;padding:17px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr;gap:12px}.card{padding:16px;border-radius:20px;min-height:auto}
  .topicbar{padding-bottom:8px}.subject{font-size:14px;padding:12px}.float{left:13px;right:13px}.float button{flex:1}
}
@media(max-width:430px){
  body{font-size:15px}.stats{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.actions button{width:100%}
  h1{font-size:21px}.hero h2{font-size:22px}.section-title h2{font-size:20px}.code{font-size:12px}.subject{padding:11px 8px}
}
@media print{
  header,.hero,.float{display:none}body{background:#fff;color:#111}main{max-width:none}.grid{grid-template-columns:1fr 1fr}.card{background:#fff;color:#111;border:1px solid #ccc;break-inside:avoid;box-shadow:none}.code{background:#f5f5f5;color:#111}
}
</style></head><body>
<header><div class="wrap"><div class="top"><div><h1>M094 — понятная шпаргалка</h1><p class="sub">Чистые карточки: Алгоритмы и Базы данных. Удобно читать с телефона.</p></div><div class="actions"><input id="search" class="search" placeholder="Поиск: 2НФ, BFS, JOIN, O(n)..."><button onclick="clearSearch()">Очистить</button></div></div><div class="subjects"><button class="subject active" data-subject="algo">Алгоритмы</button><button class="subject" data-subject="db">Базы данных</button></div><div id="topicbar" class="topicbar"></div></div></header>
<main><section class="hero"><div class="panel"><h2 id="heroTitle">Алгоритмы и структуры данных</h2><p id="heroText" class="sub">Краткие карточки по структурам алгоритмов, функциям, сортировкам, Big O и графам.</p><div class="chips" id="chips"></div></div><div class="panel stats"><div class="stat"><b id="sectionCount">0</b><span>разделов</span></div><div class="stat"><b id="cardCount">0</b><span>карточек</span></div></div></section><div id="content"></div></main><div class="float"><button onclick="window.scrollTo({top:0,behavior:'smooth'})">Наверх</button><button onclick="window.print()">PDF</button></div>
<script>
const ALGO = [["Структуры алгоритмов", [["Линейные структуры алгоритмов", "Последовательное выполнение операций одна за другой. Нет условий или циклов.", "Пример: int a=10; int b=5; int sum=a+b; printf(\"%d\", sum);", "Применение: арифметика, ввод/вывод, вычисление формул."], ["Разветвляющиеся структуры", "Выбор пути выполнения в зависимости от условия.", "if / else / else if, switch-case", "Ошибки: отсутствие break в switch, нечёткие условия."], ["Циклические структуры", "Многократное выполнение блока кода.", "for — известное число итераций; while — предусловие; do-while — постусловие.", "Если число повторений заранее неизвестно — while или do-while."], ["Задачи на циклы", "Суммы, произведения, подсчёты, сортировки, статистика.", "Сумма массива, поиск минимума, подсчёт чётных/нечётных.", "Двойной цикл часто используется для матриц."], ["Ввод-вывод массивов", "Работа с одномерными и двумерными массивами.", "arr[i], mat[i][j], printf(\"%4d\", mat[i][j])", "Двумерный массив обходится вложенными циклами."], ["Строковые данные", "Последовательность символов, завершается \\0.", "char str[100]; char* str=\"Hello\";", "scanf(\"%s\") читает до пробела, fgets безопаснее."], ["Функции string.h", "Стандартные функции обработки строк.", "strlen, strcpy, strcat, strcmp, strchr, strstr", "strcmp возвращает 0, если строки равны."], ["Ошибки", "Типичные ошибки в массивах, циклах и строках.", "Выход за границы массива, строка без \\0, неинициализированные переменные.", "Всегда проверяй границы цикла."]]], ["Функции и рекурсия", [["Зачем нужны функции", "Повторное использование кода, читаемость, отладка, модульность.", "int sum(int a,int b){ return a+b; }", "Если код повторяется — выноси в функцию."], ["Синтаксис функции", "тип_возврата имя(параметры) { тело }", "int square(int x){ return x*x; }", "Если функция ниже main, нужен прототип."], ["void", "Функция ничего не возвращает или не принимает параметры.", "void printHello(void){ printf(\"Hello\"); }", "Нельзя возвращать значение из void-функции."], ["Аргументы функции", "В C передача обычно по значению.", "void update(int* x){ *x=10; }", "Для изменения оригинала — указатель."], ["Передача массива", "Массив передаётся как адрес первого элемента.", "void f(int arr[], int size)", "Размер массива передают отдельно."], ["Перегрузка функций", "В C++ можно одинаковое имя, разные параметры; в C нельзя.", "sum(int,int), sum(float,float)", "В C используют разные имена."], ["Рекурсия", "Функция вызывает саму себя. Нужен базовый случай.", "factorial(n): if n==0 return 1; else n*factorial(n-1)", "Без базы — бесконечная рекурсия."], ["Рекурсия vs цикл", "Рекурсия читаемее для деревьев, но использует стек. Цикл быстрее и экономнее.", "Фибоначчи рекурсией без мемоизации — O(2^n).", "На КТ любят спрашивать базовый случай."]]], ["Поиск и сортировки", [["Линейный поиск", "Проверяет каждый элемент массива подряд.", "O(n)", "Работает и на неотсортированных данных."], ["Двоичный поиск", "Делит отсортированный массив пополам.", "O(log n)", "Только для отсортированного массива."], ["Bubble Sort", "Обмен соседних элементов.", "O(n²), лучший O(n)", "Простой, но медленный."], ["Insertion Sort", "Вставка элемента в отсортированную левую часть.", "O(n²), лучший O(n)", "Хорош для маленьких/почти отсортированных массивов."], ["Selection Sort", "Поиск минимума и обмен с текущей позицией.", "O(n²)", "Мало обменов."], ["Counting Sort", "Подсчёт количества каждого значения.", "O(n+k)", "Для целых чисел в ограниченном диапазоне."], ["Radix Sort", "Сортировка по разрядам стабильной сортировкой.", "O(n·k)", "Для целых чисел/строк фиксированной длины."], ["Merge Sort", "Разделить, отсортировать половины, слить.", "O(n log n), память O(n)", "Стабильная."], ["Quick Sort", "Pivot, разделение на меньше/больше, рекурсия.", "Средняя O(n log n), худшая O(n²)", "Очень быстрая на практике."], ["Heap Sort", "Построить кучу и извлекать максимум.", "O(n log n)", "Не стабильная, доп. память O(1)."]]], ["Структуры данных", [["Массив", "Непрерывный блок памяти, доступ по индексу.", "Доступ O(1), поиск O(n), удаление со сдвигом O(n)", "В C размер статического массива фиксирован."], ["Стек", "LIFO — последний пришёл, первый ушёл.", "push/pop/top — O(1)", "Используется в рекурсии, выражениях, backtracking."], ["Очередь", "FIFO — первый пришёл, первый ушёл.", "enqueue/dequeue/front — O(1)", "Используется в BFS."], ["Приоритетная очередь", "Извлекается элемент с наивысшим приоритетом.", "Обычно через кучу.", "push/pop — O(log n)."], ["Связный список", "Узлы, каждый хранит next.", "Вставка в начало O(1), поиск O(n)", "Нет доступа по индексу."], ["Двусвязный список", "Узел хранит next и prev.", "Удаление по указателю O(1)", "Можно двигаться в обе стороны."], ["Циклический список", "Последний элемент указывает на первый.", "Операции как у списка.", "Полезен для кольцевых буферов."], ["Хэш-таблица", "Ключ → индекс через хэш-функцию.", "Среднее O(1), худшее O(n)", "Коллизии решаются цепочками или открытой адресацией."], ["Хэш-функция", "Преобразует ключ в индекс массива.", "hash(k)=k % m", "Должна быть быстрой и равномерной."], ["Коллизии", "Два разных ключа дают один индекс.", "Separate chaining, linear/quadratic probing, double hashing", "Load factor α = n/m."]]], ["Сложность Big O", [["O(1)", "Время не зависит от размера входа.", "arr[0], проверка if, присваивание", "Лучший тип сложности."], ["O(log n)", "На каждом шаге задача уменьшается в несколько раз.", "Binary Search, сбалансированные деревья", "Растёт очень медленно."], ["O(n)", "Один проход по данным.", "Линейный поиск, сумма массива", "n вырос в 10 раз → время примерно в 10 раз."], ["O(n log n)", "Линейная работа + деление.", "Merge Sort, Heap Sort, Quick средний", "Хорошая сложность сортировок."], ["O(n²)", "Двойные вложенные циклы / сравнение пар.", "Bubble, Selection, Insertion", "Быстро становится медленной."], ["O(n³)", "Тройные циклы.", "Floyd, матрицы", "Очень высокая сложность."], ["O(2^n)", "Перебор подмножеств.", "Наивный Fibonacci, brute force let state={subject:'algo', topic:'all', q:''};
const meta={algo:{title:'Алгоритмы и структуры данных',text:'Краткие карточки по структурам алгоритмов, функциям, сортировкам, Big O и графам.',chips:['циклы','функции','рекурсия','поиск','сортировки','структуры данных','Big O','графы']},db:{title:'Базы данных',text:'Краткие карточки по целостности, реляционной алгебре, SQL, проектированию, нормализации и SQL Server.',chips:['целостность','реляционная алгебра','JOIN','GROUP BY','HAVING','проектирование','нормализация','SQL Server']}};
function data(){return state.subject==='algo'?ALGO:DB}
function norm(s){return (s||'').toString().toLowerCase()}
function renderTabs(){
 document.querySelectorAll('.subject').forEach(b=>{b.classList.toggle('active',b.dataset.subject===state.subject);});
 const bar=document.getElementById('topicbar'); bar.innerHTML='';
 const all=document.createElement('button'); all.className='topic '+(state.topic==='all'?'active':''); all.textContent='Все разделы'; all.onclick=()=>{state.topic='all';render()}; bar.appendChild(all);
 data().forEach((sec,i)=>{let btn=document.createElement('button');btn.className='topic '+(state.topic===sec[0]?'active':'');btn.textContent=sec[0];btn.onclick=()=>{state.topic=sec[0];render()};bar.appendChild(btn)})
}
function renderHero(){const m=meta[state.subject];document.getElementById('heroTitle').textContent=m.title;document.getElementById('heroText').textContent=m.text;document.getElementById('chips').innerHTML=m.chips.map(c=>`<span class="chip">${c}</span>`).join('');document.getElementById('sectionCount').textContent=data().length;document.getElementById('cardCount').textContent=data().reduce((a,s)=>a+s[1].length,0)}
function cardHtml(c){return `<article class="card"><h3>${c[0]}</h3><p>${c[1]}</p><div class="label">Пример / детали</div><div class="code">${c[2]}</div><p class="note">${c[3]}</p></article>`}
function renderContent(){
 const q=norm(state.q); let html=''; let total=0;
 data().forEach(sec=>{ if(state.topic!=='all' && state.topic!==sec[0]) return; let cards=sec[1].filter(c=>!q || norm(c.join(' ')).includes(q)); if(!cards.length) return; total+=cards.length; html+=`<section><div class="section-title"><h2>${sec[0]}</h2><span class="count">${cards.length} карточек</span></div><div class="grid">${cards.map(cardHtml).join('')}</div></section>`; });
 document.getElementById('content').innerHTML=html||'<div class="empty">Ничего не найдено. Попробуй другой запрос.</div>';
}
function render(){renderTabs();renderHero();renderContent()}
document.querySelectorAll('.subject').forEach(b=>b.onclick=()=>{state.subject=b.dataset.subject;state.topic='all';render();window.scrollTo({top:0,behavior:'smooth'})});

function clearSearch(){document.getElementById('search').value='';state.q='';renderContent()}
render();
